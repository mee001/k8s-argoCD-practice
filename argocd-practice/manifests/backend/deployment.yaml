apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-file-mount
  namespace: test
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
      - name: my-registry-secret
      containers:
      - name: backend
        image: dockmee001/my-private-app:v1
        ports:
        - containerPort: 80
        volumeMounts:
        - name: config-vol
          mountPath: /etc/config
        - name: secret-vol
          mountPath: /etc/secret
      volumes:
      - name: config-vol
        configMap:
          name: frontend-config
      - name: secret-vol
        secret:
          secretName: frontend-secret
