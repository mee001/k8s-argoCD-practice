apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend
  namespace: argocd
spec:
  project: default
  source: 
    repoURL: https://github.com/mee001/k8s-argocd-practice.git
    targetRevision: HEAD 
    path: argocd-practice/charts/backend
    helm: 
      valueFiles:
        - values.yaml
  destination: 
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy: 
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

