replicaCount: 1

image:
  repository: dockmee001/my-private-app
  tag: v1
  pullPolicy: Always

imagePullSecrets:
    - name: my-registry-secret

container:
  port: 80

service:
  type: ClusterIP
  port: 80
  targetPort: 80

ingress:
  enabled: false
  className: nginx
  host: backend.local
  path: /
  pathType: Prefix

resources: {}
